name: Workstream
description: A substantial contributor-owned capability; canonical work-item records own lifecycle and dependencies.
title: "[Workstream] "
labels: ["workstream"]
body:
  - type: markdown
    attributes:
      value: "Workstreams provide meaningful ownership. Implementation is split into linked, reviewable sub-issues."
  - type: input
    id: canonical-record
    attributes:
      label: Local planning ID or pending maintainer registration
      description: Provide the planning ID when applicable, or write pending maintainer registration. A GitHub-numbered record/checkpoint is added after issue creation and before Ready.
  - type: input
    id: owner
    attributes:
      label: Workstream owner
      description: GitHub username responsible for driving this workstream.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: planning-id
    attributes:
      label: Local planning ID, if applicable
      placeholder: "S-1 or none"
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: User-visible capability and why it matters.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals
      description: Included semantic boundaries, excluded work, and target paths when known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Required tests, supplied applications, diagrams, and observable completion criteria.
    validations:
      required: true
  - type: textarea
    id: subissues
    attributes:
      label: Planned sub-issues and dependencies
      description: Link sub-issues and identify blocked-by relationships.
    validations:
      required: true
  - type: textarea
    id: governance
    attributes:
      label: Planned decision tier, exact path lease, first observable, focused command, and final gate
      description: State planning-time governance and verification inputs; candidate heads and receipts belong in the PR.
    validations:
      required: true
